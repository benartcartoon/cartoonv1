characters:
  main_character:
    name: MIO
    role: main
    reference_images:
      - main/front.png
    appearance: >-
      MIO is a very simple toddler-friendly kawaii cartoon kitten with a large round head and a small rounded sitting body. Mostly creamy white fur with fixed orange patches, orange upright ears with pink inner ears, a fixed orange patch over one side of the forehead and cheek, huge round glossy dark brown-black eyes with bright white highlights, a tiny pink nose, short dark whiskers and a cheerful open smile. MIO always wears the same red-orange collar with a shiny yellow-gold bell. The thick curled tail is orange with darker orange stripe bands. Clean smooth vector cartoon style, rounded shapes, soft gentle shading, child-friendly proportions, no realism, no redesign.
    never_change:
      - same round face and large-head small-body proportions
      - same cream-white and orange fur pattern
      - same huge glossy dark eyes with white highlights
      - same pink nose and pink inner ears
      - same red-orange collar with yellow-gold bell
      - same orange striped curled tail
      - same simple toddler-friendly kawaii cartoon style

